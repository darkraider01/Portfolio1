name: Update portfolio data

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/fetch-oss-contributions.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/fetch-project-updates.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/fetch-oss-heatmap.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/oss-contributions.json public/data/oss-heatmap.json src/data/projects.js
          git diff --staged --quiet || git commit -m "chore: update OSS contributions and project data"
          # GitHub occasionally answers a push with a transient 500. The fetched data is
          # already committed at this point, so retry instead of throwing the run away.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push attempt ${attempt} failed, retrying in $((attempt * 15))s" >&2
            sleep $((attempt * 15))
          done
          echo "push failed after 3 attempts" >&2
          exit 1


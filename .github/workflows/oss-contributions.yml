name: Update portfolio data

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-oss-contributions.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/fetch-project-updates.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/oss-contributions.json src/data/projects.js
          git diff --staged --quiet || git commit -m "chore: update OSS contributions and project data"
          git push

